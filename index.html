<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f5f5;--text:#111;--muted:#555;--ctrl-bg:rgba(255,255,255,0.92);--ctrl-text:#222;
}
[data-theme="dark"]{
  --bg:#0c0c0c;--text:#f0f0f0;--muted:#999;--ctrl-bg:rgba(18,18,18,0.95);--ctrl-text:#ddd;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;transition:background .3s,color .3s}
body{
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  user-select:none;-webkit-user-select:none;padding:1rem 1rem 3.5rem;
  position:relative;overflow:hidden;
}

/* soft gradient background */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 28% 18%, rgba(170,195,255,0.22), transparent 55%),
    radial-gradient(ellipse at 72% 82%, rgba(255,195,170,0.16), transparent 50%);
}
[data-theme="dark"] body::before{
  background:
    radial-gradient(ellipse at 25% 15%, rgba(55,85,150,0.32), transparent 55%),
    radial-gradient(ellipse at 75% 85%, rgba(110,55,35,0.18), transparent 50%);
}

#time{
  position:relative;z-index:1;
  font-size:clamp(3.8rem,17vw,11.5rem);
  font-weight:700;
  letter-spacing:0.02em;
  font-variant-numeric:tabular-nums;
  line-height:1;
  margin-bottom:1.3rem;
  text-shadow:0 2px 12px rgba(0,0,0,0.07);
  display:flex;align-items:baseline;justify-content:center;
}
[data-theme="dark"] #time{text-shadow:0 2px 16px rgba(0,0,0,0.4)}
#h, #m, #s{
  display:inline-block;
}
#h.jump, #m.jump, #s.jump{
  animation: digitJump 0.28s ease-out;
}
#h.fade, #m.fade, #s.fade{
  animation: digitFade 0.32s ease-out;
}
@keyframes digitJump{
  0%{transform:translateY(0);opacity:1}
  35%{transform:translateY(0.18em);opacity:0.55}
  100%{transform:translateY(0);opacity:1}
}
@keyframes digitFade{
  0%{opacity:1}
  40%{opacity:0.15}
  100%{opacity:1}
}
#ms{
  display:none;
  font-size:0.38em;
  font-weight:500;
  opacity:0.55;
  margin-left:0.12em;
  letter-spacing:0.02em;
  vertical-align:baseline;
  transform:translateY(-0.05em);
}
#ms.show{display:inline;}
#fxTypeCtrl{display:none;}

#ampm{
  font-size:0.26em;
  font-weight:500;
  opacity:0.4;
  letter-spacing:0.05em;
  margin-left:0.18em;
  transform:translateY(-0.12em);
}

.info{position:relative;z-index:1;text-align:center;line-height:1.5}
#solar{
  font-size:clamp(1.05rem,3.3vw,1.75rem);
  color:var(--text);
  font-weight:500;
  margin-bottom:0.3rem;
}
#lunar{
  font-size:clamp(0.88rem,2.5vw,1.2rem);
  color:var(--muted);
  margin-bottom:0.65rem;
}
#event-today,#event-next{
  font-size:clamp(0.8rem,2.2vw,1.05rem);
  color:var(--muted);
  margin-top:0.3rem;
}
#event-today b,#event-next b{color:var(--text);font-weight:500}

.controls{
  position:fixed;
  bottom:0;left:0;right:0;
  z-index:20;
  display:flex;justify-content:center;align-items:center;gap:1.4rem;flex-wrap:wrap;
  padding:0.7rem 1rem;
  background:var(--ctrl-bg);
  color:var(--ctrl-text);
  font-size:0.9rem;
  border-top:1px solid rgba(128,128,128,0.2);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transform:translateY(100%);
  transition:transform 0.25s ease;
  pointer-events:none;
}
.controls.show{
  transform:translateY(0);
  pointer-events:auto;
}
.ctrl{display:flex;align-items:center;gap:0.4rem}
.ctrl label{opacity:0.85;white-space:nowrap}
select{
  background:var(--bg);color:var(--text);
  border:1px solid rgba(128,128,128,0.35);
  border-radius:6px;padding:0.28rem 0.45rem;
  font-size:0.9rem;cursor:pointer;
}
.version{
  position:fixed;bottom:0.55rem;right:0.8rem;
  font-size:0.72rem;opacity:0.4;z-index:21;cursor:pointer;
}
#barToggle{
  position:fixed;
  bottom:0.4rem;
  left:50%;
  transform:translateX(-50%);
  z-index:30;
  width:48px;height:28px;
  border:none;
  border-radius:12px;
  background:rgba(128,128,128,0.4);
  color:var(--text);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
  opacity:0.75;
  transition:bottom 0.25s ease, opacity 0.2s, background 0.2s;
}
#barToggle:hover{opacity:1;background:rgba(128,128,128,0.55)}
#barToggle.open{bottom:3.6rem}
#barToggle span{display:block;line-height:1}
</style>
</head>
<body>
  <div id="time"><span id="h">00</span>:<span id="m">00</span>:<span id="s">00</span><span id="ms"></span></div>
  <div class="info">
    <div id="solar">---</div>
    <div id="lunar">Âm: ---</div>
    <div id="event-today">Sự kiện hôm nay: ---</div>
    <div id="event-next">Sự kiện lần tới: ---</div>
  </div>

  <div class="controls">
    <div class="ctrl">
      <label>Định dạng</label>
      <select id="fmt">
        <option value="24">24h</option>
        <option value="12">12h</option>
      </select>
    </div>
    <div class="ctrl">
      <label>Giao diện</label>
      <select id="theme">
        <option value="auto">Tự động</option>
        <option value="light">Sáng</option>
        <option value="dark">Tối</option>
      </select>
    </div>
    <div class="ctrl">
      <label>Mili giây</label>
      <select id="msToggle">
        <option value="0">Ẩn</option>
        <option value="1">Hiện</option>
      </select>
    </div>
    <div class="ctrl">
      <label>Hiệu ứng</label>
      <select id="fxToggle">
        <option value="1">Bật</option>
        <option value="0">Tắt</option>
      </select>
    </div>
    <div class="ctrl" id="fxTypeCtrl">
      <label>Kiểu</label>
      <select id="fxType">
        <option value="jump">Nhảy</option>
        <option value="fade">Mờ</option>
      </select>
    </div>
  </div>
  <button id="barToggle" title="Hiện/ẩn thanh công cụ" aria-label="Toggle toolbar"><span>▲</span></button>
  <div class="version" id="version" title="Nhấn để reset">v1.7</div>

<script>
/* ===== Lunar (Hồ Ngọc Đức) ===== */
const PI=Math.PI;
function jdFromDate(dd,mm,yy){const a=Math.floor((14-mm)/12),y=yy+4800-a,m=mm+12*a-3;let jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045;if(jd<2299161){jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-32083}return jd}
function NewMoon(k){const T=k/1236.85,T2=T*T,T3=T2*T,dr=PI/180;let Jd1=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;Jd1=Jd1+0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);const M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3,Mpr=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3,F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;let C1=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*dr*M);C1=C1-0.4068*Math.sin(Mpr*dr)+0.0161*Math.sin(dr*2*Mpr);C1=C1-0.0004*Math.sin(dr*3*Mpr);C1=C1+0.0104*Math.sin(dr*2*F)-0.0051*Math.sin(dr*(M+Mpr));C1=C1-0.0074*Math.sin(dr*(M-Mpr))+0.0004*Math.sin(dr*(2*F+M));C1=C1-0.0004*Math.sin(dr*(2*F-M))-0.0006*Math.sin(dr*(2*F+Mpr))+0.0010*Math.sin(dr*(2*F-Mpr))+0.0005*Math.sin(dr*(2*Mpr+M));const deltat=T<-11?0.001+0.000839*T+0.0001603*T2-0.00009839*T3:0.001+0.0005181*T+0.0002*T2;return Jd1+C1-deltat}
function SunLongitude(jdn){const T=(jdn-2451545.0)/36525,T2=T*T,dr=PI/180,M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2,L0=280.46645+36000.76983*T+0.0003032*T2,DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M)+(0.019993-0.000101*T)*Math.sin(dr*2*M)+0.000290*Math.sin(dr*3*M);let L=L0+DL;L=L*dr;L=L-PI*2*(Math.floor(L/(PI*2)));return L}
function getSunLongitude(dayNumber,timeZone){return Math.floor(SunLongitude(dayNumber-0.5-timeZone/24)/PI*6)}
function getNewMoonDay(k,timeZone){return Math.floor(NewMoon(k)+0.5+timeZone/24)}
function getLunarMonth11(yy,timeZone){const off=jdFromDate(31,12,yy)-2415021,k=Math.floor(off/29.530588853);let nm=getNewMoonDay(k,timeZone),sunLong=getSunLongitude(nm,timeZone);if(sunLong>=9){nm=getNewMoonDay(k-1,timeZone)}return nm}
function getLeapMonthOffset(a11,timeZone){const k=Math.floor((a11-2415021.076998695)/29.530588853+0.5);let last=0,i=1,arc=getSunLongitude(getNewMoonDay(k+i,timeZone),timeZone);do{last=arc;i++;arc=getSunLongitude(getNewMoonDay(k+i,timeZone),timeZone)}while(arc!=last&&i<14);return i-1}
function convertSolar2Lunar(dd,mm,yy,timeZone=7){const dayNumber=jdFromDate(dd,mm,yy),k=Math.floor((dayNumber-2415021.076998695)/29.530588853);let monthStart=getNewMoonDay(k+1,timeZone);if(monthStart>dayNumber){monthStart=getNewMoonDay(k,timeZone)}let a11=getLunarMonth11(yy,timeZone),b11=a11,lunarYear;if(a11>=monthStart){lunarYear=yy;a11=getLunarMonth11(yy-1,timeZone)}else{lunarYear=yy+1;b11=getLunarMonth11(yy+1,timeZone)}const lunarDay=dayNumber-monthStart+1;let lunarLeap=0,diff=Math.floor((monthStart-a11)/29),lunarMonth=diff+11;if(b11-a11>365){const leapMonthDiff=getLeapMonthOffset(a11,timeZone);if(diff>=leapMonthDiff){lunarMonth=diff+10;if(diff==leapMonthDiff)lunarLeap=1}}if(lunarMonth>12)lunarMonth-=12;if(lunarMonth>=11&&diff<4)lunarYear-=1;return[lunarDay,lunarMonth,lunarYear,lunarLeap]}

const CAN=['Giáp','Ất','Bính','Đinh','Mậu','Kỷ','Canh','Tân','Nhâm','Quý'];
const CHI=['Tý','Sửu','Dần','Mão','Thìn','Tỵ','Ngọ','Mùi','Thân','Dậu','Tuất','Hợi'];
function getCanChiYear(year){return CAN[(year+6)%10]+' '+CHI[(year+8)%12]}

const SOLAR_EVENTS=[
  {m:1,d:1,name:'Tết Dương lịch'},
  {m:4,d:30,name:'Ngày Giải phóng miền Nam'},
  {m:5,d:1,name:'Ngày Quốc tế Lao động'},
  {m:9,d:2,name:'Quốc khánh'},
  {m:3,d:8,name:'Quốc tế Phụ nữ'},
  {m:10,d:20,name:'Ngày Phụ nữ Việt Nam'},
  {m:11,d:20,name:'Ngày Nhà giáo Việt Nam'},
  {m:12,d:22,name:'Ngày Thành lập Quân đội'},
  {m:12,d:25,name:'Giáng sinh'}
];
const LUNAR_EVENTS=[
  {m:1,d:1,name:'Tết Nguyên Đán'},
  {m:1,d:15,name:'Rằm tháng Giêng'},
  {m:3,d:10,name:'Giỗ Tổ Hùng Vương'},
  {m:5,d:5,name:'Tết Đoan Ngọ'},
  {m:7,d:15,name:'Lễ Vu Lan'},
  {m:8,d:15,name:'Tết Trung Thu'},
  {m:12,d:23,name:'Ông Táo về trời'}
];

const $ = id => document.getElementById(id);
const settings = {
  fmt: localStorage.getItem('clock_fmt') || '24',
  theme: localStorage.getItem('clock_theme') || 'auto',
  ms: localStorage.getItem('clock_ms') === '1',
  fx: localStorage.getItem('clock_fx') !== '0',
  fxType: localStorage.getItem('clock_fxType') || 'jump'
};
$('fmt').value = settings.fmt;
$('theme').value = settings.theme;
$('msToggle').value = settings.ms ? '1' : '0';
$('fxToggle').value = settings.fx ? '1' : '0';
$('fxType').value = settings.fxType;
if(settings.ms) $('ms').classList.add('show');
if(settings.fx) $('fxTypeCtrl').style.display = 'flex';

function applyTheme(){
  let t = settings.theme;
  if(t === 'auto'){
    const h = new Date().getHours();
    t = (h >= 6 && h < 18) ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', t);
}
applyTheme();

$('fmt').onchange = e => {
  settings.fmt = e.target.value;
  localStorage.setItem('clock_fmt', settings.fmt);
  update();
};
$('theme').onchange = e => {
  settings.theme = e.target.value;
  localStorage.setItem('clock_theme', settings.theme);
  applyTheme();
};

const days = ['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];

function getVNDate(){
  const n = new Date();
  const utc = n.getTime() + n.getTimezoneOffset()*60000;
  return new Date(utc + 7*3600000);
}

function findEvents(solarY, solarM, solarD, lunarD, lunarM){
  let today = null;
  for(const e of SOLAR_EVENTS){
    if(e.m===solarM && e.d===solarD){ today = e.name; break; }
  }
  if(!today){
    for(const e of LUNAR_EVENTS){
      if(e.m===lunarM && e.d===lunarD){ today = e.name; break; }
    }
  }
  let nextName=null, nextDate=null;
  const base = new Date(solarY, solarM-1, solarD);
  for(let i=1;i<=400;i++){
    const dt = new Date(base.getTime() + i*86400000);
    const y=dt.getFullYear(), m=dt.getMonth()+1, d=dt.getDate();
    for(const e of SOLAR_EVENTS){
      if(e.m===m && e.d===d){
        nextName=e.name; nextDate=`${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`;
        return {today, nextName, nextDate};
      }
    }
    const [ld,lm] = convertSolar2Lunar(d,m,y,7);
    for(const e of LUNAR_EVENTS){
      if(e.m===lm && e.d===ld){
        nextName=e.name; nextDate=`${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`;
        return {today, nextName, nextDate};
      }
    }
  }
  return {today, nextName, nextDate};
}

let timerId = null;
let lastH = -1, lastM = -1, lastS = -1;

function triggerAnim(el){
  if(!settings.fx || !el) return;
  const cls = settings.fxType === 'fade' ? 'fade' : 'jump';
  el.classList.remove('jump','fade');
  void el.offsetWidth;
  el.classList.add(cls);
}

function updateTimeOnly(){
  const vn = getVNDate();
  let h = vn.getHours(), mi = vn.getMinutes(), s = vn.getSeconds();
  const ms = vn.getMilliseconds();

  let displayH = h;
  if(settings.fmt === '12'){
    const ap = h >= 12 ? 'PM' : 'AM';
    displayH = h % 12 || 12;
    let ampm = document.getElementById('ampm');
    if(!ampm){
      ampm = document.createElement('span');
      ampm.id = 'ampm';
      $('time').appendChild(ampm);
    }
    ampm.textContent = ap;
  } else {
    const ampm = document.getElementById('ampm');
    if(ampm) ampm.remove();
  }

  const hStr = String(displayH).padStart(2,'0');
  const mStr = String(mi).padStart(2,'0');
  const sStr = String(s).padStart(2,'0');

  const hEl = $('h'), mEl = $('m'), sEl = $('s');

  if(hStr !== hEl.textContent){
    hEl.textContent = hStr;
    if(lastH !== -1) triggerAnim(hEl);
  }
  if(mStr !== mEl.textContent){
    mEl.textContent = mStr;
    if(lastM !== -1) triggerAnim(mEl);
  }
  if(sStr !== sEl.textContent){
    sEl.textContent = sStr;
    if(lastS !== -1) triggerAnim(sEl);
  }

  lastH = displayH; lastM = mi; lastS = s;

  const msEl = $('ms');
  if(settings.ms){
    msEl.textContent = '.' + String(ms).padStart(3,'0');
    msEl.classList.add('show');
  } else {
    msEl.textContent = '';
    msEl.classList.remove('show');
  }
}

function updateFull(){
  updateTimeOnly();
  const vn = getVNDate();
  const y = vn.getFullYear(), m = vn.getMonth()+1, d = vn.getDate();

  $('solar').textContent = `${days[vn.getDay()]} ngày ${String(d).padStart(2,'0')} tháng ${m} năm ${y}`;

  const [ld, lm, ly, leap] = convertSolar2Lunar(d, m, y, 7);
  const canchi = getCanChiYear(ly);
  const leapTxt = leap ? ' (nhuận)' : '';
  $('lunar').textContent = `Âm: Ngày ${ld} Tháng ${lm}${leapTxt} Năm ${canchi}`;

  const ev = findEvents(y, m, d, ld, lm);
  $('event-today').innerHTML = `Sự kiện hôm nay: <b>${ev.today || 'không có'}</b>`;
  if(ev.nextName){
    $('event-next').innerHTML = `Sự kiện lần tới: <b>${ev.nextName}</b> (${ev.nextDate})`;
  } else {
    $('event-next').innerHTML = `Sự kiện lần tới: <b>---</b>`;
  }

  if(settings.theme === 'auto') applyTheme();
}

function update(){
  if(settings.ms) updateTimeOnly();
  else updateFull();
}

let fullTimerId = null;

function startTimer(){
  if(timerId) clearInterval(timerId);
  if(fullTimerId) clearInterval(fullTimerId);
  if(settings.ms){
    timerId = setInterval(updateTimeOnly, 50);
    fullTimerId = setInterval(updateFull, 1000);
  } else {
    timerId = setInterval(updateFull, 1000);
  }
}
updateFull();
startTimer();

// Toggle milliseconds from toolbar
$('msToggle').onchange = function(){
  settings.ms = this.value === '1';
  localStorage.setItem('clock_ms', settings.ms ? '1' : '0');
  startTimer();
  updateFull();
};

// Effect on/off
$('fxToggle').onchange = function(){
  settings.fx = this.value === '1';
  localStorage.setItem('clock_fx', settings.fx ? '1' : '0');
  $('fxTypeCtrl').style.display = settings.fx ? 'flex' : 'none';
};

// Effect type
$('fxType').onchange = function(){
  settings.fxType = this.value;
  localStorage.setItem('clock_fxType', settings.fxType);
};

// Toolbar toggle (always start hidden)
const bar = document.querySelector('.controls');
const barBtn = $('barToggle');
barBtn.onclick = function(){
  const open = bar.classList.toggle('show');
  barBtn.classList.toggle('open', open);
  barBtn.querySelector('span').textContent = open ? '▼' : '▲';
};

$("version").onclick = function(){
  localStorage.removeItem("clock_fmt");
  localStorage.removeItem("clock_theme");
  localStorage.removeItem("clock_bg");
  localStorage.removeItem("clock_bg_shown");
  localStorage.removeItem("clock_ms");
  localStorage.removeItem("clock_fx");
  localStorage.removeItem("clock_fxType");
  alert("Trang web này cho biết (reset thành công)");
  location.reload();
};
</script>
</body>
</html>
