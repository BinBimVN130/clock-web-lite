<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f5f5;--text:#111;--muted:#555;--ctrl-bg:rgba(255,255,255,0.92);--ctrl-text:#222;
}
[data-theme="dark"]{
  --bg:#0c0c0c;--text:#f0f0f0;--muted:#999;--ctrl-bg:rgba(18,18,18,0.95);--ctrl-text:#ddd;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;transition:background .3s,color .3s}
body{
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  user-select:none;-webkit-user-select:none;padding:1rem 1rem 3.5rem;
  position:relative;overflow:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 28% 18%, rgba(170,195,255,0.22), transparent 55%),
    radial-gradient(ellipse at 72% 82%, rgba(255,195,170,0.16), transparent 50%);
}
[data-theme="dark"] body::before{
  background:
    radial-gradient(ellipse at 25% 15%, rgba(55,85,150,0.32), transparent 55%),
    radial-gradient(ellipse at 75% 85%, rgba(110,55,35,0.18), transparent 50%);
}

/* ===== CLOCK ===== */
#view-clock{position:relative;z-index:1;text-align:center;width:100%}
#time{
  font-size:clamp(3.8rem,17vw,11.5rem);
  font-weight:700;letter-spacing:0.02em;font-variant-numeric:tabular-nums;
  line-height:1;margin-bottom:1.3rem;text-shadow:0 2px 12px rgba(0,0,0,0.07);
  display:flex;align-items:baseline;justify-content:center;
}
[data-theme="dark"] #time{text-shadow:0 2px 16px rgba(0,0,0,0.4)}
#h,#m,#s{display:inline-block}
#h.jump,#m.jump,#s.jump{animation:digitJump .28s ease-out}
#h.fade,#m.fade,#s.fade{animation:digitFade .32s ease-out}
@keyframes digitJump{0%{transform:translateY(0);opacity:1}35%{transform:translateY(.18em);opacity:.55}100%{transform:translateY(0);opacity:1}}
@keyframes digitFade{0%{opacity:1}40%{opacity:.15}100%{opacity:1}}
#ms{display:none;font-size:.38em;font-weight:500;opacity:.55;margin-left:.12em;letter-spacing:.02em;vertical-align:baseline;transform:translateY(-.05em)}
#ms.show{display:inline}
#s.hidden,.colon-s.hidden{display:none!important}
#ampm{font-size:.26em;font-weight:500;opacity:.4;letter-spacing:.05em;margin-left:.18em;transform:translateY(-.12em)}
.info{text-align:center;line-height:1.5}
#solar{font-size:clamp(1.05rem,3.3vw,1.75rem);color:var(--text);font-weight:500;margin-bottom:.3rem}
#lunar{font-size:clamp(.88rem,2.5vw,1.2rem);color:var(--muted);margin-bottom:.65rem}
#event-today,#event-next{font-size:clamp(.8rem,2.2vw,1.05rem);color:var(--muted);margin-top:.3rem}
#event-today b,#event-next b{color:var(--text);font-weight:500}

/* ===== STOPWATCH & TIMER ===== */
#view-sw,#view-tm{display:none;position:relative;z-index:1;text-align:center;width:100%}
.sw-time,.tm-time{
  font-size:clamp(3rem,14vw,9rem);font-weight:700;font-variant-numeric:tabular-nums;
  letter-spacing:.03em;line-height:1;margin-bottom:2rem;
}
.tm-hint{font-size:clamp(.85rem,2.5vw,1.1rem);color:var(--muted);margin-bottom:1.2rem;opacity:.8}
.tm-seg{
  display:inline-block;cursor:pointer;border-bottom:3px solid rgba(128,128,128,.45);
  padding:0 .15em;min-width:1.3em;transition:border-color .15s,opacity .15s;
}
.tm-seg:hover,.tm-seg:focus{border-color:var(--text);outline:none}
.tm-seg.active{border-color:#4caf50;opacity:.85}
.sw-btns,.tm-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn{
  border:none;border-radius:999px;padding:.7rem 1.8rem;font-size:1.05rem;font-weight:600;
  cursor:pointer;color:#fff;min-width:7rem;transition:transform .1s,opacity .15s;
}
.btn:active{transform:scale(.96)}
.btn-start{background:#2e7d32}
.btn-stop{background:#c62828}
.btn-reset{background:#555}
.btn:disabled{opacity:.4;cursor:default}

/* ===== CONTROLS ===== */
.controls{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  display:flex;justify-content:center;align-items:center;gap:1.2rem;flex-wrap:wrap;
  padding:.7rem 1rem;background:var(--ctrl-bg);color:var(--ctrl-text);font-size:.9rem;
  border-top:1px solid rgba(128,128,128,.2);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transform:translateY(100%);transition:transform .25s ease;pointer-events:none;
}
.controls.show{transform:translateY(0);pointer-events:auto}
.ctrl{display:flex;align-items:center;gap:.35rem}
.ctrl label{opacity:.85;white-space:nowrap}
.ctrl-group{
  display:flex;align-items:center;gap:.8rem;padding:.25rem .7rem;
  border-left:2px solid rgba(128,128,128,.35);border-right:2px solid rgba(128,128,128,.35);margin:0 .15rem;
}
#fxTypeCtrl{display:none}
select{
  background:var(--bg);color:var(--text);border:1px solid rgba(128,128,128,.35);
  border-radius:6px;padding:.28rem .45rem;font-size:.9rem;cursor:pointer;
}
.version{position:fixed;bottom:.55rem;right:.8rem;font-size:.72rem;opacity:.4;z-index:21;cursor:pointer}
#barToggle{
  position:fixed;bottom:.4rem;left:50%;transform:translateX(-50%);z-index:30;
  width:48px;height:28px;border:none;border-radius:12px;
  background:rgba(128,128,128,.4);color:var(--text);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:16px;opacity:.75;
  transition:bottom .25s ease,opacity .2s,background .2s;
}
#barToggle:hover{opacity:1;background:rgba(128,128,128,.55)}
#barToggle.open{bottom:3.6rem}
#barToggle span{display:block;line-height:1}
.clock-only{display:flex}
body.mode-sw .clock-only,body.mode-tm .clock-only{display:none!important}
</style>
</head>
<body>
<!-- CLOCK -->
<div id="view-clock">
  <div id="time"><span id="h">00</span>:<span id="m">00</span><span class="colon-s">:</span><span id="s">00</span><span id="ms"></span></div>
  <div class="info">
    <div id="solar">---</div>
    <div id="lunar">Âm: ---</div>
    <div id="event-today">Sự kiện hôm nay: ---</div>
    <div id="event-next">Sự kiện lần tới: ---</div>
  </div>
</div>

<!-- STOPWATCH -->
<div id="view-sw">
  <div class="sw-time" id="swDisplay">00:00:00.0</div>
  <div class="sw-btns">
    <button class="btn btn-start" id="swStart">Bắt đầu</button>
    <button class="btn btn-reset" id="swReset">Reset</button>
  </div>
</div>

<!-- TIMER -->
<div id="view-tm">
  <div class="tm-hint" id="tmHint">Chỉnh sửa bằng cách ấn vào các ô số</div>
  <div class="tm-time" id="tmDisplay">
    <span class="tm-seg" id="tmH" data-part="h">00</span>
    <span> : </span>
    <span class="tm-seg" id="tmM" data-part="m">00</span>
    <span> : </span>
    <span class="tm-seg" id="tmS" data-part="s">00</span>
  </div>
  <div class="tm-btns">
    <button class="btn btn-start" id="tmStart">Bắt đầu</button>
    <button class="btn btn-reset" id="tmReset">Reset</button>
  </div>
</div>

<div class="controls">
  <div class="ctrl">
    <label>Chức năng</label>
    <select id="mode">
      <option value="clock">Đồng hồ</option>
      <option value="sw">Bấm giờ</option>
      <option value="tm">Hẹn giờ</option>
    </select>
  </div>
  <div class="ctrl">
    <label>Giao diện</label>
    <select id="theme">
      <option value="auto">Tự động</option>
      <option value="light">Sáng</option>
      <option value="dark">Tối</option>
    </select>
  </div>
  <div class="ctrl clock-only">
    <label>Định dạng</label>
    <select id="fmt">
      <option value="24">24h</option>
      <option value="12">12h</option>
    </select>
  </div>
  <div class="ctrl clock-only">
    <label>Mili giây</label>
    <select id="msToggle">
      <option value="0">Ẩn</option>
      <option value="1">Hiện</option>
    </select>
  </div>
  <div class="ctrl clock-only">
    <label>Giây</label>
    <select id="secToggle">
      <option value="1">Hiện</option>
      <option value="0">Ẩn</option>
    </select>
  </div>
  <div class="ctrl-group clock-only">
    <div class="ctrl">
      <label>Hiệu ứng</label>
      <select id="fxToggle">
        <option value="1">Bật</option>
        <option value="0">Tắt</option>
      </select>
    </div>
    <div class="ctrl" id="fxTypeCtrl">
      <label>Kiểu</label>
      <select id="fxType">
        <option value="jump">Nhảy</option>
        <option value="fade">Mờ</option>
      </select>
    </div>
  </div>
</div>
<button id="barToggle" title="Hiện/ẩn thanh công cụ"><span>▲</span></button>
<div class="version" id="version" title="Nhấn để reset">v1.9</div>

<script>
/* ===== Lunar (Hồ Ngọc Đức) ===== */
const PI=Math.PI;
function jdFromDate(dd,mm,yy){const a=Math.floor((14-mm)/12),y=yy+4800-a,m=mm+12*a-3;let jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045;if(jd<2299161){jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-32083}return jd}
function NewMoon(k){const T=k/1236.85,T2=T*T,T3=T2*T,dr=PI/180;let Jd1=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;Jd1=Jd1+0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);const M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3,Mpr=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3,F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;let C1=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*dr*M);C1=C1-0.4068*Math.sin(Mpr*dr)+0.0161*Math.sin(dr*2*Mpr);C1=C1-0.0004*Math.sin(dr*3*Mpr);C1=C1+0.0104*Math.sin(dr*2*F)-0.0051*Math.sin(dr*(M+Mpr));C1=C1-0.0074*Math.sin(dr*(M-Mpr))+0.0004*Math.sin(dr*(2*F+M));C1=C1-0.0004*Math.sin(dr*(2*F-M))-0.0006*Math.sin(dr*(2*F+Mpr))+0.0010*Math.sin(dr*(2*F-Mpr))+0.0005*Math.sin(dr*(2*Mpr+M));const deltat=T<-11?0.001+0.000839*T+0.0001603*T2-0.00009839*T3:0.001+0.0005181*T+0.0002*T2;return Jd1+C1-deltat}
function SunLongitude(jdn){const T=(jdn-2451545.0)/36525,T2=T*T,dr=PI/180,M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2,L0=280.46645+36000.76983*T+0.0003032*T2,DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M)+(0.019993-0.000101*T)*Math.sin(dr*2*M)+0.000290*Math.sin(dr*3*M);let L=L0+DL;L=L*dr;L=L-PI*2*(Math.floor(L/(PI*2)));return L}
function getSunLongitude(dayNumber,timeZone){return Math.floor(SunLongitude(dayNumber-0.5-timeZone/24)/PI*6)}
function getNewMoonDay(k,timeZone){return Math.floor(NewMoon(k)+0.5+timeZone/24)}
function getLunarMonth11(yy,timeZone){const off=jdFromDate(31,12,yy)-2415021,k=Math.floor(off/29.530588853);let nm=getNewMoonDay(k,timeZone),sunLong=getSunLongitude(nm,timeZone);if(sunLong>=9){nm=getNewMoonDay(k-1,timeZone)}return nm}
function getLeapMonthOffset(a11,timeZone){const k=Math.floor((a11-2415021.076998695)/29.530588853+0.5);let last=0,i=1,arc=getSunLongitude(getNewMoonDay(k+i,timeZone),timeZone);do{last=arc;i++;arc=getSunLongitude(getNewMoonDay(k+i,timeZone),timeZone)}while(arc!=last&&i<14);return i-1}
function convertSolar2Lunar(dd,mm,yy,timeZone=7){const dayNumber=jdFromDate(dd,mm,yy),k=Math.floor((dayNumber-2415021.076998695)/29.530588853);let monthStart=getNewMoonDay(k+1,timeZone);if(monthStart>dayNumber){monthStart=getNewMoonDay(k,timeZone)}let a11=getLunarMonth11(yy,timeZone),b11=a11,lunarYear;if(a11>=monthStart){lunarYear=yy;a11=getLunarMonth11(yy-1,timeZone)}else{lunarYear=yy+1;b11=getLunarMonth11(yy+1,timeZone)}const lunarDay=dayNumber-monthStart+1;let lunarLeap=0,diff=Math.floor((monthStart-a11)/29),lunarMonth=diff+11;if(b11-a11>365){const leapMonthDiff=getLeapMonthOffset(a11,timeZone);if(diff>=leapMonthDiff){lunarMonth=diff+10;if(diff==leapMonthDiff)lunarLeap=1}}if(lunarMonth>12)lunarMonth-=12;if(lunarMonth>=11&&diff<4)lunarYear-=1;return[lunarDay,lunarMonth,lunarYear,lunarLeap]}
const CAN=['Giáp','Ất','Bính','Đinh','Mậu','Kỷ','Canh','Tân','Nhâm','Quý'];
const CHI=['Tý','Sửu','Dần','Mão','Thìn','Tỵ','Ngọ','Mùi','Thân','Dậu','Tuất','Hợi'];
function getCanChiYear(year){return CAN[(year+6)%10]+' '+CHI[(year+8)%12]}
const SOLAR_EVENTS=[{m:1,d:1,name:'Tết Dương lịch'},{m:4,d:30,name:'Ngày Giải phóng miền Nam'},{m:5,d:1,name:'Ngày Quốc tế Lao động'},{m:9,d:2,name:'Quốc khánh'},{m:3,d:8,name:'Quốc tế Phụ nữ'},{m:10,d:20,name:'Ngày Phụ nữ Việt Nam'},{m:11,d:20,name:'Ngày Nhà giáo Việt Nam'},{m:12,d:22,name:'Ngày Thành lập Quân đội'},{m:12,d:25,name:'Giáng sinh'}];
const LUNAR_EVENTS=[{m:1,d:1,name:'Tết Nguyên Đán'},{m:1,d:15,name:'Rằm tháng Giêng'},{m:3,d:10,name:'Giỗ Tổ Hùng Vương'},{m:5,d:5,name:'Tết Đoan Ngọ'},{m:7,d:15,name:'Lễ Vu Lan'},{m:8,d:15,name:'Tết Trung Thu'},{m:12,d:23,name:'Ông Táo về trời'}];
const days=['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
function getVNDate(){const n=new Date();const utc=n.getTime()+n.getTimezoneOffset()*60000;return new Date(utc+7*3600000)}
function findEvents(solarY,solarM,solarD,lunarD,lunarM){
  let today=null;
  for(const e of SOLAR_EVENTS){if(e.m===solarM&&e.d===solarD){today=e.name;break}}
  if(!today){for(const e of LUNAR_EVENTS){if(e.m===lunarM&&e.d===lunarD){today=e.name;break}}}
  let nextName=null,nextDate=null;
  const base=new Date(solarY,solarM-1,solarD);
  for(let i=1;i<=400;i++){
    const dt=new Date(base.getTime()+i*86400000);
    const y=dt.getFullYear(),m=dt.getMonth()+1,d=dt.getDate();
    for(const e of SOLAR_EVENTS){if(e.m===m&&e.d===d){nextName=e.name;nextDate=`${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`;return{today,nextName,nextDate}}}
    const[ld,lm]=convertSolar2Lunar(d,m,y,7);
    for(const e of LUNAR_EVENTS){if(e.m===lm&&e.d===ld){nextName=e.name;nextDate=`${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`;return{today,nextName,nextDate}}}
  }
  return{today,nextName,nextDate};
}

const $=id=>document.getElementById(id);
const settings={
  mode:localStorage.getItem('clock_mode')||'clock',
  fmt:localStorage.getItem('clock_fmt')||'24',
  theme:localStorage.getItem('clock_theme')||'auto',
  ms:localStorage.getItem('clock_ms')==='1',
  sec:localStorage.getItem('clock_sec')!=='0',
  fx:localStorage.getItem('clock_fx')!=='0',
  fxType:localStorage.getItem('clock_fxType')||'jump'
};

/* ===== Theme ===== */
function applyTheme(){
  let t=settings.theme;
  if(t==='auto'){const h=new Date().getHours();t=(h>=6&&h<18)?'light':'dark'}
  document.documentElement.setAttribute('data-theme',t);
}
applyTheme();

/* ===== Mode switch ===== */
function setMode(mode){
  settings.mode=mode;
  localStorage.setItem('clock_mode',mode);
  $('view-clock').style.display=mode==='clock'?'block':'none';
  $('view-sw').style.display=mode==='sw'?'block':'none';
  $('view-tm').style.display=mode==='tm'?'block':'none';
  document.body.classList.remove('mode-sw','mode-tm');
  if(mode==='sw')document.body.classList.add('mode-sw');
  if(mode==='tm')document.body.classList.add('mode-tm');
  // stop timers when leaving
  if(mode!=='sw')swStop(true);
  if(mode!=='tm')tmStop(true);
  if(mode==='clock')startClockTimer();
  else stopClockTimer();
}
$('mode').value=settings.mode;

/* ===== CLOCK ===== */
let clockTimerId=null,clockFullId=null,lastH=-1,lastM=-1,lastS=-1;
function triggerAnim(el){
  if(!settings.fx||!el)return;
  const cls=settings.fxType==='fade'?'fade':'jump';
  el.classList.remove('jump','fade');void el.offsetWidth;el.classList.add(cls);
}
function updateTimeOnly(){
  const vn=getVNDate();
  let h=vn.getHours(),mi=vn.getMinutes(),s=vn.getSeconds();
  const ms=vn.getMilliseconds();
  let displayH=h;
  if(settings.fmt==='12'){
    const ap=h>=12?'PM':'AM';displayH=h%12||12;
    let ampm=document.getElementById('ampm');
    if(!ampm){ampm=document.createElement('span');ampm.id='ampm';$('time').appendChild(ampm)}
    ampm.textContent=ap;
  }else{const ampm=document.getElementById('ampm');if(ampm)ampm.remove()}
  const hStr=String(displayH).padStart(2,'0'),mStr=String(mi).padStart(2,'0'),sStr=String(s).padStart(2,'0');
  const hEl=$('h'),mEl=$('m'),sEl=$('s');
  if(hStr!==hEl.textContent){hEl.textContent=hStr;if(lastH!==-1)triggerAnim(hEl)}
  if(mStr!==mEl.textContent){mEl.textContent=mStr;if(lastM!==-1)triggerAnim(mEl)}
  if(sStr!==sEl.textContent){sEl.textContent=sStr;if(lastS!==-1)triggerAnim(sEl)}
  lastH=displayH;lastM=mi;lastS=s;
  const msEl=$('ms');
  if(settings.ms){msEl.textContent='.'+String(ms).padStart(3,'0');msEl.classList.add('show')}
  else{msEl.textContent='';msEl.classList.remove('show')}
}
function updateFull(){
  updateTimeOnly();
  const vn=getVNDate();const y=vn.getFullYear(),m=vn.getMonth()+1,d=vn.getDate();
  $('solar').textContent=`${days[vn.getDay()]} ngày ${String(d).padStart(2,'0')} tháng ${m} năm ${y}`;
  const[ld,lm,ly,leap]=convertSolar2Lunar(d,m,y,7);
  $('lunar').textContent=`Âm: Ngày ${ld} Tháng ${lm}${leap?' (nhuận)':''} Năm ${getCanChiYear(ly)}`;
  const ev=findEvents(y,m,d,ld,lm);
  $('event-today').innerHTML=`Sự kiện hôm nay: <b>${ev.today||'không có'}</b>`;
  $('event-next').innerHTML=ev.nextName?`Sự kiện lần tới: <b>${ev.nextName}</b> (${ev.nextDate})`:`Sự kiện lần tới: <b>---</b>`;
  if(settings.theme==='auto')applyTheme();
}
function startClockTimer(){
  stopClockTimer();
  if(settings.ms){clockTimerId=setInterval(updateTimeOnly,50);clockFullId=setInterval(updateFull,1000)}
  else{clockTimerId=setInterval(updateFull,1000)}
  updateFull();
}
function stopClockTimer(){
  if(clockTimerId){clearInterval(clockTimerId);clockTimerId=null}
  if(clockFullId){clearInterval(clockFullId);clockFullId=null}
}

/* ===== STOPWATCH (high precision) ===== */
let swRunning=false,swStartPerf=0,swAcc=0,swRaf=0;
function fmtSW(ms){
  const total=Math.floor(ms);
  const cs=Math.floor((total%1000)/100);
  const s=Math.floor(total/1000)%60;
  const m=Math.floor(total/60000)%60;
  const h=Math.floor(total/3600000);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${cs}`;
}
function swTick(){
  if(!swRunning)return;
  const now=performance.now();
  $('swDisplay').textContent=fmtSW(swAcc+(now-swStartPerf));
  swRaf=requestAnimationFrame(swTick);
}
function swStartStop(){
  if(swRunning){
    // stop
    swAcc+=performance.now()-swStartPerf;
    swRunning=false;
    if(swRaf)cancelAnimationFrame(swRaf);
    $('swStart').textContent='Bắt đầu';
    $('swStart').className='btn btn-start';
    $('swReset').style.display='';
  }else{
    // start - respond immediately
    swRunning=true;
    swStartPerf=performance.now();
    $('swStart').textContent='Dừng';
    $('swStart').className='btn btn-stop';
    $('swReset').style.display='none';
    swRaf=requestAnimationFrame(swTick);
  }
}
function swStop(silent){
  if(swRunning){
    swAcc+=performance.now()-swStartPerf;
    swRunning=false;
    if(swRaf)cancelAnimationFrame(swRaf);
  }
  if(!silent){
    $('swStart').textContent='Bắt đầu';
    $('swStart').className='btn btn-start';
    $('swReset').style.display='';
  }
}
function swReset(){
  swStop(true);
  swAcc=0;
  $('swDisplay').textContent='00:00:00.0';
  $('swStart').textContent='Bắt đầu';
  $('swStart').className='btn btn-start';
  $('swReset').style.display='';
}
$('swStart').onclick=swStartStop;
$('swReset').onclick=swReset;

/* ===== TIMER ===== */
let tmH=0,tmM=0,tmS=0;
let tmRunning=false,tmEndPerf=0,tmRaf=0,tmBeeping=false,tmBeepId=0;
let audioCtx=null;

function ensureAudio(){
  if(!audioCtx){
    try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
  }
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
}
function playBeep(){
  ensureAudio();
  if(!audioCtx)return;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.frequency.value=880;
  g.gain.value=0.15;
  o.start();
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.2);
  o.stop(audioCtx.currentTime+0.22);
}
function startAlarm(){
  if(tmBeeping)return;
  tmBeeping=true;
  let n=0;
  const loop=()=>{
    if(!tmBeeping)return;
    playBeep();
    n++;
    tmBeepId=setTimeout(loop,n%4===0?600:250);
  };
  loop();
}
function stopAlarm(){
  tmBeeping=false;
  if(tmBeepId){clearTimeout(tmBeepId);tmBeepId=0}
}

function renderTM(){
  $('tmH').textContent=String(tmH).padStart(2,'0');
  $('tmM').textContent=String(tmM).padStart(2,'0');
  $('tmS').textContent=String(tmS).padStart(2,'0');
}
function tmFromRemaining(ms){
  ms=Math.max(0,Math.ceil(ms/1000)*1000); // snap display to seconds while running looks cleaner; keep internal ms
  const total=Math.max(0,Math.floor(ms/1000));
  tmH=Math.floor(total/3600);
  tmM=Math.floor((total%3600)/60);
  tmS=total%60;
  renderTM();
}
function tmTick(){
  if(!tmRunning)return;
  const left=tmEndPerf-performance.now();
  if(left<=0){
    tmRunning=false;
    tmH=0;tmM=0;tmS=0;renderTM();
    $('tmStart').textContent='Dừng';
    $('tmStart').className='btn btn-stop';
    $('tmReset').style.display='none';
    $('tmHint').textContent='Hết giờ!';
    startAlarm();
    return;
  }
  // show with tenths while running for precision feel
  const totalMs=Math.max(0,left);
  const h=Math.floor(totalMs/3600000);
  const m=Math.floor((totalMs%3600000)/60000);
  const s=Math.floor((totalMs%60000)/1000);
  $('tmH').textContent=String(h).padStart(2,'0');
  $('tmM').textContent=String(m).padStart(2,'0');
  $('tmS').textContent=String(s).padStart(2,'0');
  tmRaf=requestAnimationFrame(tmTick);
}
function tmStartStop(){
  if(tmBeeping){
    stopAlarm();
    $('tmStart').textContent='Bắt đầu';
    $('tmStart').className='btn btn-start';
    $('tmReset').style.display='';
    $('tmHint').textContent='Chỉnh sửa bằng cách ấn vào các ô số';
    return;
  }
  if(tmRunning){
    // pause
    const left=Math.max(0,tmEndPerf-performance.now());
    tmFromRemaining(left);
    tmRunning=false;
    if(tmRaf)cancelAnimationFrame(tmRaf);
    $('tmStart').textContent='Bắt đầu';
    $('tmStart').className='btn btn-start';
    $('tmReset').style.display='';
    $('tmHint').textContent='Chỉnh sửa bằng cách ấn vào các ô số';
  }else{
    const total=(tmH*3600+tmM*60+tmS)*1000;
    if(total<=0){alert('Vui lòng đặt thời gian trước');return}
    ensureAudio(); // unlock audio on user gesture
    tmRunning=true;
    tmEndPerf=performance.now()+total;
    $('tmStart').textContent='Dừng';
    $('tmStart').className='btn btn-stop';
    $('tmReset').style.display='none';
    $('tmHint').textContent='';
    tmRaf=requestAnimationFrame(tmTick);
  }
}
function tmStop(silent){
  if(tmRunning){
    const left=Math.max(0,tmEndPerf-performance.now());
    tmFromRemaining(left);
    tmRunning=false;
    if(tmRaf)cancelAnimationFrame(tmRaf);
  }
  stopAlarm();
  if(!silent){
    $('tmStart').textContent='Bắt đầu';
    $('tmStart').className='btn btn-start';
    $('tmReset').style.display='';
    $('tmHint').textContent='Chỉnh sửa bằng cách ấn vào các ô số';
  }
}
function tmReset(){
  tmStop(true);
  tmH=0;tmM=0;tmS=0;renderTM();
  $('tmStart').textContent='Bắt đầu';
  $('tmStart').className='btn btn-start';
  $('tmReset').style.display='';
  $('tmHint').textContent='Chỉnh sửa bằng cách ấn vào các ô số';
}
$('tmStart').onclick=tmStartStop;
$('tmReset').onclick=tmReset;

// Timer digit input - safe prompt
document.querySelectorAll('.tm-seg').forEach(el=>{
  el.onclick=function(){
    if(tmRunning||tmBeeping)return;
    const part=this.dataset.part;
    const max=part==='h'?99:59;
    const cur=part==='h'?tmH:part==='m'?tmM:tmS;
    const label=part==='h'?'giờ':part==='m'?'phút':'giây';
    const raw=prompt(`Nhập ${label} (0-${max}):`,String(cur));
    if(raw===null)return;
    const num=parseInt(raw,10);
    if(isNaN(num)||num<0||num>max){alert(`Giá trị không hợp lệ. Nhập số từ 0 đến ${max}.`);return}
    if(part==='h')tmH=num;else if(part==='m')tmM=num;else tmS=num;
    renderTM();
  };
});

/* ===== Controls init ===== */
$('fmt').value=settings.fmt;
$('theme').value=settings.theme;
$('msToggle').value=settings.ms?'1':'0';
$('secToggle').value=settings.sec?'1':'0';
$('fxToggle').value=settings.fx?'1':'0';
$('fxType').value=settings.fxType;
if(settings.ms)$('ms').classList.add('show');
if(settings.fx)$('fxTypeCtrl').style.display='flex';
if(!settings.sec){$('s').classList.add('hidden');document.querySelector('.colon-s').classList.add('hidden')}

$('mode').onchange=e=>{setMode(e.target.value)};
$('theme').onchange=e=>{settings.theme=e.target.value;localStorage.setItem('clock_theme',settings.theme);applyTheme()};
$('fmt').onchange=e=>{settings.fmt=e.target.value;localStorage.setItem('clock_fmt',settings.fmt);updateFull()};
$('msToggle').onchange=function(){
  settings.ms=this.value==='1';localStorage.setItem('clock_ms',settings.ms?'1':'0');
  if(settings.mode==='clock')startClockTimer();updateFull();
};
$('secToggle').onchange=function(){
  settings.sec=this.value==='1';localStorage.setItem('clock_sec',settings.sec?'1':'0');
  const sEl=$('s'),colon=document.querySelector('.colon-s');
  if(settings.sec){sEl.classList.remove('hidden');colon.classList.remove('hidden')}
  else{
    sEl.classList.add('hidden');colon.classList.add('hidden');
    if(settings.ms){settings.ms=false;localStorage.setItem('clock_ms','0');$('msToggle').value='0';$('ms').classList.remove('show');$('ms').textContent='';if(settings.mode==='clock')startClockTimer()}
  }
  updateFull();
};
$('fxToggle').onchange=function(){
  settings.fx=this.value==='1';localStorage.setItem('clock_fx',settings.fx?'1':'0');
  $('fxTypeCtrl').style.display=settings.fx?'flex':'none';
};
$('fxType').onchange=function(){settings.fxType=this.value;localStorage.setItem('clock_fxType',settings.fxType)};

// Toolbar toggle
const bar=document.querySelector('.controls');
const barBtn=$('barToggle');
barBtn.onclick=function(){
  const open=bar.classList.toggle('show');
  barBtn.classList.toggle('open',open);
  barBtn.querySelector('span').textContent=open?'▼':'▲';
};

$('version').onclick=function(){
  ['clock_mode','clock_fmt','clock_theme','clock_ms','clock_sec','clock_fx','clock_fxType','clock_bg','clock_bg_shown'].forEach(k=>localStorage.removeItem(k));
  alert('Trang web này cho biết (reset thành công)');
  location.reload();
};

// Boot
setMode(settings.mode);
</script>
